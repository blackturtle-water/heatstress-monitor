name: Heat Stress Monitor

on:
  schedule:
    # GitHub Actions cron is UTC.
    # Work time collection: KST 08:00~17:50 every 10 minutes.
    # KST 08:00~08:50 = UTC 23:00~23:50 previous day
    # KST 09:00~17:50 = UTC 00:00~08:50
    - cron: "*/10 23,0-8 * * *"

    # Off-hours collection: KST 18:05~07:05 once per hour.
    # KST 18:05~23:05 = UTC 09:05~14:05
    # KST 00:05~07:05 = UTC 15:05~22:05 previous UTC day
    - cron: "5 9-22 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run heat stress monitor
        env:
          KMA_AUTH_KEY: ${{ secrets.KMA_AUTH_KEY }}
          KMA_FORECAST_SERVICE_KEY: ${{ secrets.KMA_FORECAST_SERVICE_KEY }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          DASHBOARD_URL: "https://blackturtle-water.github.io/heatstress-monitor/"
        run: |
          set -e
          echo "=== Start heat stress monitor ==="
          python -u scripts/monitor.py
          echo "=== Finished heat stress monitor ==="

      - name: Copy dashboard history data
        run: |
          mkdir -p docs
          if [ -f data/history.csv ]; then
            cp data/history.csv docs/history.csv
            echo "Copied data/history.csv to docs/history.csv"
          else
            echo "data/history.csv not found"
          fi

      - name: Show current status file
        run: |
          echo "=== data/current.json ==="
          if [ -f data/current.json ]; then
            cat data/current.json
          else
            echo "data/current.json not found"
          fi

          echo ""
          echo "=== data/last_state.json ==="
          if [ -f data/last_state.json ]; then
            cat data/last_state.json
          else
            echo "data/last_state.json not found"
          fi

      - name: Commit updated dashboard data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data docs

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update heat stress monitoring data"
            git push
          fi
