name: Heat Stress Monitor

on:
  schedule:
    # GitHub Actions cron uses UTC.
    # KST 08:03-17:53, every 10 minutes at 03, 13, 23, 33, 43, 53.
    - cron: "3,13,23,33,43,53 23,0-8 * * *"
    # KST 18:03-07:03, once per hour at minute 03.
    - cron: "3 9-22 * * *"
  workflow_dispatch:

concurrency:
  group: heatstress-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run heat stress monitor
        env:
          KMA_AUTH_KEY: ${{ secrets.KMA_AUTH_KEY }}
          KMA_FORECAST_SERVICE_KEY: ${{ secrets.KMA_FORECAST_SERVICE_KEY }}
          KMA_VILAGE_FCST_AUTH_KEY: ${{ secrets.KMA_VILAGE_FCST_AUTH_KEY }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          HOLIDAY_SERVICE_KEY: ${{ secrets.HOLIDAY_SERVICE_KEY }}
        run: |
          set -e
          echo "=== Start heat stress monitor ==="
          python scripts/monitor.py
          echo "=== Finished heat stress monitor ==="

      - name: Sync dashboard data
        run: |
          set -e
          mkdir -p docs
          cp data/current.json docs/current.json
          cp data/last_state.json docs/last_state.json
          cp data/history.csv docs/history.csv

      - name: Show current status file
        run: |
          echo "=== data/current.json ==="
          cat data/current.json
          echo "=== data/last_state.json ==="
          cat data/last_state.json

      - name: Commit updated dashboard data
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git add data/current.json data/last_state.json data/history.csv docs/current.json docs/last_state.json docs/history.csv
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update heat stress monitoring data"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
